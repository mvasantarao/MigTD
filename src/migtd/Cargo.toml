[package]
name = "migtd"
version = "0.7.1"
license = "BSD-2-Clause-Patent"
edition = "2021"

[[bin]]
name = "migtd"
required-features = ["entry"]

[[bin]]
name = "host_wfr_test"
path = "src/bin/host_wfr_test/main.rs"
required-features = ["SnpEmu"]

[dev-dependencies]
attestation = { path = "../attestation", default-features = false, features = ["test"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync"] }

[dependencies]
nix = { version = "0.27", features = ["mount", "fs"], optional = true }
bitfield = "0.13.2"
anyhow = { version = "1.0.68", default-features = false }
async_io = { path = "../async/async_io" }
async_runtime = { path = "../async/async_runtime" }
attestation = { path = "../attestation", default-features = false, optional = true }
cc-measurement = { path = "../../deps/td-shim/cc-measurement", optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
crypto = { path = "../crypto", optional = true }
futures-util = { version = "0.3.17", default-features = false }
lazy_static = { version = "1.0", features = ["spin_no_std"] }
log = { version = "0.4.29", features = ["kv"] }
pci = { path="../devices/pci", optional = true }
policy = {path = "../policy", optional = true}
rust_std_stub = { path = "../std-support/rust-std-stub" }
r-efi = "3.2.0"
scroll = { version = "0.10", default-features = false, features = ["derive"]}
spin = "0.9.2"
tdx-tdcall = { path = "../../deps/td-shim/tdx-tdcall", optional = true}
td-logger = { path = "../../deps/td-shim/td-logger", features = ["tdx"], optional = true }
td-logger-emu = { path = "../../deps/td-shim-AzCVMEmu/td-logger-emu", optional = true }
td-layout = { path = "../../deps/td-shim/td-layout", optional = true}
td-loader = { path = "../../deps/td-shim/td-loader", optional = true}
td-paging = { path = "../../deps/td-shim/td-paging", optional = true}
td-payload = { path = "../../deps/td-shim/td-payload", features = ["tdx"], optional = true }
td-shim-interface = { path = "../../deps/td-shim/td-shim-interface", optional = true}
virtio = { path="../devices/virtio", optional = true }
vsock = { path="../devices/vsock", default-features = false, optional = true }
virtio_serial = { path="../devices/virtio_serial", optional = true }
vmcall_raw = { path="../devices/vmcall_raw", optional = true }
x86 = "0.47.0"
x86_64 = { version = "0.14", default-features = false, features = ["instructions"] }
pal = { path = "../pal", optional = true }
snp_emu = { path = "../snp_emu", optional = true }
zerocopy = { version = "0.8", features = ["derive"] }
bitfield-struct = "0.11"
raw-cpuid = "11.6.0"
sha2 = { version = "0.10.2", default-features = false, optional = true }

# AzCVMEmu optional deps (grouped)
tdx-tdcall-emu = { path = "../../deps/td-shim-AzCVMEmu/tdx-tdcall", optional = true }
td-payload-emu = { path = "../../deps/td-shim-AzCVMEmu/td-payload-emu", optional = true }
td-shim = { path = "../../deps/td-shim/td-shim", default-features = false, optional = true }
td-shim-interface-emu = { path = "../../deps/td-shim-AzCVMEmu/td-shim-interface", optional = true, features = ["std"] }
td-shim-emu = { path = "../../deps/td-shim-AzCVMEmu/td-shim", optional = true }
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync"], optional = true }

minicov = { version = "0.2", default-features = false, optional = true }
td-benchmark = { path = "../../deps/td-shim/devtools/td-benchmark", default-features = false,  optional = true }

spdmlib = {path = "../../deps/spdm-rs/spdmlib", default-features = false, features = ["spdm-ring", "chunk-cap", "mut-auth", "hashed-transcript-data"], optional = true}
codec = {path= "../../deps/spdm-rs/codec"}
maybe-async = "0.2.7"
async-trait = "0.1.71"
zeroize = { version = "1.5.0", features = ["zeroize_derive"]}
ring = { version = "0.17.14" }

[features]
default = ["virtio-vsock"]
entry = []
std = []
attestation = ["dep:attestation"]
tdx-platform = ["dep:crypto", "dep:policy", "dep:pci",
    "dep:cc-measurement", "dep:tdx-tdcall", "dep:td-logger", "dep:td-layout",
    "dep:td-loader", "dep:td-paging", "dep:td-payload", "dep:td-shim-interface",
    "dep:td-shim", "dep:virtio", "dep:spdmlib"]
cet-shstk = ["tdx-platform", "td-payload/cet-shstk"]
coverage = ["minicov"]
main = ["entry", "tdx-platform", "attestation", "policy/log", "sha2"]
policy_v2 = ["tdx-platform", "policy/policy_v2", "attestation/attest-lib-ext", "td-shim-interface-emu?/policy_v2"]
stack-guard = ["tdx-platform", "td-payload/stack-guard"]
virtio-vsock = ["tdx-platform", "vsock/virtio-vsock"]
virtio-serial = ["tdx-platform", "virtio_serial"]
vmcall-interrupt = []
vmcall-vsock = ["tdx-platform", "vsock/vmcall-vsock"]
vmcall-raw = ["tdx-platform", "vmcall_raw"]
oneshot-apic = []
test_heap_size = ["tdx-platform", "td-benchmark", "td-payload/test_heap_size"]
test_stack_size = ["tdx-platform", "td-benchmark"]
test_disable_ra_and_accept_all = ["tdx-platform", "attestation/test", "tdx-tdcall-emu?/test_mock_report"] # Dangerous: test-only RA bypass; blocked in release (see src/lib.rs)
spdm_attestation = ["main"]
test_mock_report = ["AzCVMEmu", "tdx-tdcall-emu/test_mock_report"]  # Use mock TD report in AzCVMEmu mode
use-mock-quote = ["tdx-platform", "attestation/use-mock-quote"]  # Use mock quote and mock TD report for non-AzCVMEmu testing
mock_quote_retry = ["AzCVMEmu", "tdx-tdcall-emu/mock_quote_retry"]
AzCVMEmu = [
    "std",
	"main",                     # Include main feature by default
	"attestation/AzCVMEmu",
	"crypto/AzCVMEmu",
	"policy/AzCVMEmu",
	"vmcall-raw",               # Include vmcall-raw feature by default
	"vmcall_raw/AzCVMEmu",
	"td-shim-interface-emu",
	"td-shim-emu",
	"tdx-tdcall-emu",
	"tdx-tdcall-emu/vtpm",      # Enable vTPM/IMDS attestation in AzCVMEmu
	"td-payload-emu",
	"td-logger-emu",            # Use console-based td-logger shim
	"tokio",
]
igvm-attest = ["tdx-platform", "attestation/igvm-attest"]

# SnpEmu and SnpEmuAzure share the explicit captured-fixture compatibility root.
SnpEmu = [
    "std",
    "entry",
    "dep:crypto",
    "dep:spdmlib",
    "tokio",
    "dep:pal",
    "snp-core",
    "snp-fixture",
    "snp-state-emulator",
    "snp-tcp-transport",
    "snp-mock-installation",
    "snp-mock-rebind",
    "snp-aas-verify",
    "snp_emu",
]

SnpUnderhill = [
    "SnpUnderhillRuntime",
]

SnpEmuAzure = [
    "SnpEmu",
    "SnpUnderhillRuntime",
]

snp_fixture_only = ["SnpEmu"]   # CI gate: implies SnpEmu; hardware paths must not be enabled in CI
SnpUnderhillRuntime = ["std", "snp-core", "dep:nix"]
snp-core = ["std", "dep:pal", "pal/snp-core"]
snp-aas-verify = ["snp-core", "pal/snp-aas-verify"]
snp-fixture = ["snp-core", "pal/snp-fixture"]
snp-state-emulator = ["snp-fixture", "pal/snp-state-emulator"]
snp-tcp-transport = ["snp-fixture"]
snp-mock-installation = ["snp-fixture", "pal/snp-mock-installation"]
snp-mock-rebind = ["snp-fixture", "pal/snp-mock-rebind"]
snp-linux-hardware = ["snp-core", "pal/snp-linux-hardware"]
snp-production-collateral = ["snp-core"]
snp-production-transport = ["snp-core"]
snp-production-randomness = ["snp-core", "pal/system-random"]
snp-production-installation = ["snp-core"]
snp-production-rebind = ["snp-core"]
snp-production-persistence = ["snp-core"]
# The closed provider root refuses startup at the unavailable host-control seam.
SnpHardware = ["entry", "SnpUnderhillRuntime", "snp-aas-verify",
    "snp-linux-hardware", "pal/snp-production", "snp-production-collateral",
    "snp-production-transport", "snp-production-randomness",
    "snp-production-installation", "snp-production-rebind", "snp-production-persistence"]


[patch.crates-io]
sys_time = { path = "src/std-support/sys_time" }
