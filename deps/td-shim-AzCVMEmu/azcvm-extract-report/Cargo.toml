[workspace]

[package]
name = "azcvm-extract-report"
version = "0.1.0"
edition = "2021"

[dependencies]
tdx-tdcall-emu = { path = "../tdx-tdcall", features = ["mock_report_tools", "vtpm"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
